services:
  redis:
    image: redis:7.2-alpine
    container_name: zerogate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zerogate-private-mesh
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: zerogate-kafka
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://zerogate-kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092'
      KAFKA_OFFERS_TO_REGISTER_AS_CONTROLLER: 'true'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@zerogate-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - zerogate-private-mesh
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: zerogate-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zerogate_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerogate_password}
      POSTGRES_DB: ${POSTGRES_DB:-zerogate_telemetry}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - zerogate-private-mesh
    restart: unless-stopped

  gateway:
    build: .
    container_name: zerogate-gateway
    command: uvicorn engine.gateway:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/engine
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - zerogate-private-mesh
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy

  worker:
    build: .
    container_name: zerogate-worker
    command: python3 -m engine.worker
    env_file:
      - .env
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ~/.ssh:/root/.ssh:ro
    restart: unless-stopped
    networks:
      - zerogate-private-mesh
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy

  simulator:
    build: .
    container_name: zerogate-simulator
    command: python3 simulator.py
    profiles:
      - simulate-load
    env_file:
      - .env
    networks:
      - zerogate-private-mesh

volumes:
  redis_data:
  pgdata:

networks:
  zerogate-private-mesh:
    driver: bridge
